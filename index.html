<body>
<header class="hero">
  <svg id="sky" aria-hidden="true"></svg>
  <nav aria-label="Language"><div class="lang" id="lang"></div></nav>
  <div class="hero-text">
    <h1 id="name"></h1>
    <p class="intro" id="intro"></p>
    <div class="jump" id="jump"></div>
  </div>
</header>
<main id="chapters"></main>
<footer><span id="owner"></span><div id="footer-links"></div></footer>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sections = SITE.sections.filter(s => (s.items || s.groups).length);
const links = SITE.links.map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
document.getElementById("name").textContent = SITE.name;
document.getElementById("owner").textContent = SITE.name;
document.getElementById("footer-links").innerHTML = links;

function savedLanguage() {
  const wanted = new URLSearchParams(location.search).get("lang");
  let stored = null;
  try { stored = localStorage.getItem("lang"); } catch (e) {}
  return [wanted, stored].find(x => LANGUAGES.some(l => l[0] === x)) || "en";
}
let lang = savedLanguage();
const L = x => typeof x === "string" ? x : (x[lang] || x.en);
const T = x => esc(L(x));

function stackHTML(s) {
  return `<div class="stack">${s.groups.map(g => `
    <div><h3>${T(g.name)}</h3><ul>${g.tools.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}
function metaFor(item) {
  let out = "";
  if (item.tools && item.tools.length) out += `<span>${esc(item.tools.join(", "))}</span>`;
  if (item.repo) out += `<a href="${esc(item.repo)}">${T(UI.code)}</a>`;
  if (item.site) out += `<a href="${esc(item.site)}">${T(UI.site)}</a>`;
  if (item.link) out += `<a href="${esc(item.link)}">${T(UI.result)}</a>`;
  return out;
}
function more(item) {
  if (!item.details) return "";
  return `<details><summary>${T(UI.more)}</summary><div>${L(item.details).split("\n\n").map(p => `<p>${esc(p)}</p>`).join("")}</div></details>`;
}
function timelineHTML(s) {
  return `<ol class="timeline">${s.items.map(item => `
    <li><div class="period">${T(item.period)}</div><h3>${T(item.title)}</h3><p class="org">${T(item.org)}</p></li>`).join("")}</ol>`;
}
function entriesHTML(s) {
  return `<div>${s.items.map(item => `
    <article class="entry">
      <h3>${T(item.title)}</h3>
      <p>${T(item.summary)}</p>
      <div class="meta">${metaFor(item)}</div>
      ${more(item)}
    </article>`).join("")}</div>`;
}
function renderPage() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.getElementById("intro").textContent = L(SITE.intro);
  document.getElementById("lang").innerHTML = LANGUAGES.map(([code, label, full]) =>
    `<button type="button" data-lang="${code}" aria-label="${full}" aria-pressed="${code === lang}">${label}</button>`).join("");
  document.getElementById("jump").innerHTML = sections.map(s => `<a href="#${esc(s.id)}">${T(s.title)}</a>`).join("");
  document.getElementById("chapters").innerHTML = sections.map(s => `
    <section class="chapter" id="${esc(s.id)}">
      <h2>${T(s.title)}</h2>
      ${s.groups ? stackHTML(s) : s.timeline ? timelineHTML(s) : entriesHTML(s)}
    </section>`).join("");
}
renderPage();

document.getElementById("lang").addEventListener("click", e => {
  const button = e.target.closest("button[data-lang]");
  if (!button || button.dataset.lang === lang) return;
  lang = button.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (err) {}
  const hero = document.querySelector(".hero"), before = hero.clientHeight;
  renderPage();
  if (hero.clientHeight !== before) drawSky(false);
  document.querySelector(`#lang button[data-lang="${lang}"]`).focus();
});

/* The hero drawing: weather-chart isobars that settle into the contours of a
   posterior distribution, with a flight path that becomes a real Metropolis chain. */
function drawSky(animate) {
  const svg = document.getElementById("sky");
  const hero = svg.parentElement;
  const W = hero.clientWidth, H = hero.clientHeight, narrow = W < 760;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.classList.toggle("still", !animate);

  const S = Math.min(W, H);
  const peaks = (narrow
    ? [[.66,.22,.17,1],[.86,.36,.11,.72],[.34,.33,.10,.6]]
    : [[.69,.38,.19,1],[.87,.64,.12,.74],[.56,.72,.10,.56]]
  ).map(([u,v,s,a]) => ({x:u*W, y:v*H, s:s*S, a}));
  const density = (x,y) => peaks.reduce((t,p) => t + p.a*Math.exp(-((x-p.x)**2+(y-p.y)**2)/(2*p.s*p.s)), 0);
  const smooth = (a,b,x) => { const t = Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
  const field = (x,y) => {
    const u = x/S, v = y/S;
    const isobar = .22 + .16*Math.sin(1.5*u + .9*Math.sin(1.3*v+.4) + .5) + .11*Math.cos(2.4*v - .9*u + 1.2) + .05*Math.sin(3.4*u+2.1*v);
    const t = narrow ? smooth(.72*H,.34*H,y) : smooth(.2*W,.58*W,x);
    return (1-t)*isobar + t*density(x,y)*.92 + t*.02;
  };

  const step = narrow ? 5 : 7, nx = Math.ceil(W/step)+2, ny = Math.ceil(H/step)+2, g = [];
  for (let j=0;j<ny;j++) for (let i=0;i<nx;i++) g.push(field(i*step,j*step));
  const lv = 20, lo = .03, hi = .9, paths = [];
  const mix = (a,b,t) => a.map((c,i)=>Math.round(c+(b[i]-c)*t));
  const stops = [[150,160,212],[140,149,204],[201,166,196],[238,180,170]];
  for (let k=0;k<lv;k++) {
    const L = lo + (hi-lo)*k/(lv-1); let d = "";
    for (let j=0;j<ny-1;j++) for (let i=0;i<nx-1;i++) {
      const a=g[j*nx+i], b=g[j*nx+i+1], c=g[(j+1)*nx+i+1], e=g[(j+1)*nx+i];
      const x=i*step, y=j*step, pts=[];
      if ((a<L)!==(b<L)) pts.push([x+step*(L-a)/(b-a), y]);
      if ((b<L)!==(c<L)) pts.push([x+step, y+step*(L-b)/(c-b)]);
      if ((e<L)!==(c<L)) pts.push([x+step*(L-e)/(c-e), y+step]);
      if ((a<L)!==(e<L)) pts.push([x, y+step*(L-a)/(e-a)]);
      if (pts.length===2 || pts.length===4)
        for (let q=0;q<pts.length;q+=2)
          d += `M${pts[q][0].toFixed(1)} ${pts[q][1].toFixed(1)}L${pts[q+1][0].toFixed(1)} ${pts[q+1][1].toFixed(1)}`;
    }
    const f = k/(lv-1)*3, n = Math.min(2,Math.floor(f)), col = mix(stops[n],stops[n+1],f-n);
    paths.push(`<path d="${d}" stroke="rgb(${col})" stroke-opacity="${(.5+.4*k/(lv-1)).toFixed(2)}" stroke-width="1"/>`);
  }

  let seed = 20240609; const rnd = () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const gauss = () => Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(2*Math.PI*rnd());
  const top = peaks[0], sx=-20, sy=H*(narrow?.1:.2), mx=W*(narrow?.3:.32), my=H*(narrow?.02:.05);
  const bez = t => [(1-t)**2*sx+2*(1-t)*t*mx+t*t*top.x, (1-t)**2*sy+2*(1-t)*t*my+t*t*top.y];
  let trail = ""; for (let t=0;t<=1.0001;t+=.02){const p=bez(t); trail += (t?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}
  let cur=[top.x,top.y], dots="";
  const chain=[cur];
  for (let n=0, kept=0; n<400 && kept<34; n++) {
    const prop=[cur[0]+gauss()*S*.06, cur[1]+gauss()*S*.06];
    if (rnd() < density(...prop)/density(...cur)) {
      cur=prop; kept++; chain.push(cur);
      dots+=`<circle cx="${cur[0].toFixed(1)}" cy="${cur[1].toFixed(1)}" r="1.9"/>`;
    }
  }
  for (let i=1;i<chain.length;i++) {
    const p=chain[i], q=chain[i+1]||p, end=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    trail+=`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${end[0].toFixed(1)} ${end[1].toFixed(1)}`;
  }
  const a=bez(.34), b=bez(.36), angle=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
  svg.innerHTML = `
    <g class="contours" fill="none" stroke-linecap="round">${paths.join("")}</g>
    <path class="trail" d="${trail}" pathLength="1" fill="none" stroke="#3D4270" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/>
    <g class="after" fill="#3D4270" fill-opacity=".7">${dots}</g>
    <path class="plane" transform="translate(${a[0].toFixed(1)} ${a[1].toFixed(1)}) rotate(${angle.toFixed(1)}) scale(.92)" fill="#3D4270"
      d="M15 0c0-1.3-1.4-1.9-3-1.9H6L0-10H-3L0-1.9H-7L-9.6-5H-12L-10.5 0-12 5h2.4L-7 1.9H0L-3 10H0L6 1.9h6c1.6 0 3-.6 3-1.9z"/>`;
}
drawSky(true);
let lastW = innerWidth, timer;
addEventListener("resize", () => {
  if (Math.abs(innerWidth-lastW) < 30) return;
  clearTimeout(timer); timer = setTimeout(() => { lastW = innerWidth; drawSky(false); }, 150);
});
</script>
</body>
</html>
